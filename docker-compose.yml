services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: akira-backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    networks:
      - akira-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=
        - VITE_BACKEND_PORT=8080
    container_name: akira-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - akira-network

networks:
  akira-network:
    driver: bridge
